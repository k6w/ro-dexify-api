name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # test:ci asserts a real number of tests actually executed. Plain
      # `vitest run` exits 0 even when every file fails to load and all tests
      # are skipped, which is how this workflow stayed green while nothing ran.
      - run: pnpm test:ci
      - run: pnpm test --coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: coverage
          path: coverage/
          retention-days: 14
