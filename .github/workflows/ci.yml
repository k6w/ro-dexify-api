name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly upstream drift check; see the `drift` job below.
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # test:ci asserts a real number of tests actually executed. Plain
      # `vitest run` exits 0 even when every file fails to load and all tests
      # are skipped, which is how this workflow stayed green while nothing ran.
      - run: pnpm test:ci
      - run: pnpm test --coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Runs the parsers against the live sites. Kept out of the PR gate: it makes
  # real network requests and a third-party outage must not block a merge.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:live
